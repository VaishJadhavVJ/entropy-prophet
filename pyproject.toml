[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-prophet"
version = "0.1.0"
description = "Recalibrates LLM forecast probabilities on prediction market events using CoT reasoning-step entropy and market liquidity."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "pydantic>=2.0.0",
    "scipy>=1.8.0",
    "openai>=1.0.0",
    "jinja2>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
